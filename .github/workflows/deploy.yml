name: Capsulecraft Telemetry Engine Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Set strict, specific security permissions for GitHub Pages tracking deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Base Repository Core
      uses: actions/checkout@v4

    - name: Initialize Isolated Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Ingest Calculation Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy skyfield

    - name: Execute Dual-Tracking Telemetry Engine
      run: |
        # Generate the live astronomical matrix file
        python core_engine.py > telemetry_matrix.json
        cat telemetry_matrix.json
        
        # Fallback copy so the data displays directly if hitting root domain
        cp telemetry_matrix.json index.html

    - name: Deploy Live Matrix data to GitHub Pages Branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        user_name: 'SUPRANODE00'
        user_email: 'message.luciio@gmail.com'
        commit_message: "Automated real-time telemetry matrix synchronization [Actions Build] /L✠R/"
